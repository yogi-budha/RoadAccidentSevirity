```html
{% extends "records/base.html" %}

{% block content %}

<h1>📝 Report New Accident</h1>

<div class="card">

    <form method="POST">

        {% csrf_token %}

        <div class="form-row">

            <div>

                <label>Date (BS — Eg..: 2082-06-15):</label>

                <input type="text" name="bs_date" placeholder="2082-06-15" required>

            </div>

            <div>

                <label>Time (Hour):</label>

                <select name="hour" required>
                    <option value="0">12 AM (midnight)</option>
                    <option value="1">1 AM</option>
                    <option value="2">2 AM</option>
                    <option value="3">3 AM</option>
                    <option value="4">4 AM</option>
                    <option value="5">5 AM</option>
                    <option value="6">6 AM</option>
                    <option value="7">7 AM</option>
                    <option value="8">8 AM</option>
                    <option value="9">9 AM</option>
                    <option value="10">10 AM</option>
                    <option value="11">11 AM</option>
                    <option value="12">12 PM (noon)</option>
                    <option value="13">1 PM</option>
                    <option value="14">2 PM</option>
                    <option value="15">3 PM</option>
                    <option value="16">4 PM</option>
                    <option value="17">5 PM</option>
                    <option value="18">6 PM</option>
                    <option value="19">7 PM</option>
                    <option value="20">8 PM</option>
                    <option value="21">9 PM</option>
                    <option value="22">10 PM</option>
                    <option value="23">11 PM</option>
                </select>

            </div>

        </div>

        <div class="form-row">

            <div>

                <label>Location:</label>

                <select name="location">

                    {% for loc in locations %}

                        <option value="{{ loc }}">{{ loc }}</option>

                    {% endfor %}

                </select>

            </div>

            <div>

                <label>...or new location:</label>

                <input type="text" name="other_location"
                       placeholder="If not in list Enter Name Here">

            </div>

        </div>

        <div class="form-row">

            <div>

                <label>Cause:</label>

                <select name="cause">

                    {% for c in causes %}

                        <option value="{{ c }}">{{ c }}</option>

                    {% endfor %}

                </select>

            </div>

            <div>

                <label>Vehicle Type:</label>

                <select name="vehicle">

                    {% for v in vehicles %}

                        <option value="{{ v }}">{{ v }}</option>

                    {% endfor %}

                </select>

            </div>

        </div>

        <div class="form-row">

            <div>

                <label>Deaths:</label>

                <input type="number" name="deaths" value="0" min="0">

            </div>

            <div>

                <label>Serious Injuries:</label>

                <input type="number" name="serious" value="0" min="0">

            </div>

            <div>

                <label>Minor Injuries:</label>

                <input type="number" name="minor" value="0" min="0">

            </div>

        </div>

        <button type="submit">💾 Save Accident Record</button>

    </form>

</div>

{% endblock %}
```
